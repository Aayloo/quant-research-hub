<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#172033">QS Workflow Sequence</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker></defs>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#172033" text-anchor="middle">
<rect x="85" y="75" width="150" height="48" rx="8" fill="#eef2ff" stroke="#818cf8"/><text x="160" y="106">PM</text>
<rect x="330" y="75" width="150" height="48" rx="8" fill="#e8f1ff" stroke="#60a5fa"/><text x="405" y="106">QS</text>
<rect x="575" y="75" width="150" height="48" rx="8" fill="#f5f7fa" stroke="#98a2b3"/><text x="650" y="106">Data</text>
<rect x="820" y="75" width="150" height="48" rx="8" fill="#effaf2" stroke="#4ade80"/><text x="895" y="106">Risk</text>
</g>
<g stroke="#98a2b3" stroke-width="2" stroke-dasharray="7 7">
<line x1="160" y1="123" x2="160" y2="650"/><line x1="405" y1="123" x2="405" y2="650"/><line x1="650" y1="123" x2="650" y2="650"/><line x1="895" y1="123" x2="895" y2="650"/>
</g>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#344054">
<line x1="160" y1="175" x2="405" y2="175" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="160" text-anchor="middle">Define question and mandate</text>
<line x1="405" y1="235" x2="650" y2="235" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><text x="527" y="220" text-anchor="middle">Request audited data</text>
<line x1="650" y1="295" x2="405" y2="295" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><text x="527" y="280" text-anchor="middle">Return data and quality checks</text>
<rect x="300" y="335" width="210" height="42" rx="8" fill="#e8f1ff" stroke="#60a5fa"/><text x="405" y="362" text-anchor="middle" font-weight="700">04 Alpha Signal</text>
<line x1="405" y1="420" x2="405" y2="465" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><text x="425" y="450">Build and test signal</text>
<line x1="405" y1="510" x2="160" y2="510" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="495" text-anchor="middle">Deliver alpha memo</text>
<rect x="790" y="335" width="210" height="42" rx="8" fill="#effaf2" stroke="#4ade80"/><text x="895" y="362" text-anchor="middle" font-weight="700">05 Portfolio Risk</text>
<line x1="405" y1="575" x2="895" y2="575" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="560" text-anchor="middle">Construct portfolio and assess risk</text>
<line x1="895" y1="635" x2="405" y2="635" stroke="#344054" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="620" text-anchor="middle">Return risk and cost results</text>
</g>
</svg>
